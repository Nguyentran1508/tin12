<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Tin học 12 – HKI</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1b2433;--mut:#5d6b82;--pri:#2563eb;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bd:#d8dfeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#182236;--tx:#e8edf6;--mut:#9fb0c9;--pri:#5b8cff;--okb:#12351f;--nob:#3b1717;--bd:#2c3a54;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.grid button{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.grid .cur{outline:2px solid var(--pri)}.grid .ok{background:var(--okb);border-color:var(--ok)}.grid .no{background:var(--nob);border-color:var(--no)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.q{font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.ex{margin-top:14px;padding:12px 14px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px}
.ctl{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.ctl button{padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
.ctl .p{background:var(--pri);color:#fff;border-color:var(--pri)}
.st{padding:10px 0;border-top:1px solid var(--bd)}.st b{display:block;margin-bottom:6px;font-weight:600}.tf{margin-right:8px;padding:6px 20px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);cursor:pointer;font:inherit}.tf.ok{background:var(--okb);border-color:var(--ok)}.tf.no{background:var(--nob);border-color:var(--no)}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation}.opt,.q,.st b,.ex{overflow-wrap:anywhere}
@media(max-width:600px){body{font-size:15px}nav{padding:8px;gap:4px;scrollbar-width:none}nav button{padding:8px 11px;font-size:13px}main{padding:10px}h1{font-size:17px}.bar{font-size:13px}.grid{gap:5px}.grid button{width:calc((100% - 35px)/8);min-width:38px;height:42px;font-size:14px}.card{padding:12px;border-radius:12px}.q{font-size:15.5px}.opt{padding:12px;min-height:48px;font-size:15px}.st{padding:10px 0}.tf{width:calc(50% - 5px);margin:0 4px 0 0;min-height:44px;padding:8px 0}.ex{font-size:14px}.ctl{position:sticky;bottom:0;background:var(--bg);padding:10px 0 8px;margin-top:10px}.ctl button{flex:1;min-height:46px}}
@media(max-width:360px){nav button{padding:7px 9px;font-size:12px}.grid button{height:38px}}
.mb{display:none}.lb{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 4px 2px}.mn{display:flex;flex-direction:column;gap:6px}.mn button{width:100%;text-align:left;border-radius:10px;padding:10px 12px;font-size:14px}
@media(min-width:761px){body{padding-left:260px}nav{position:fixed;top:0;left:0;bottom:0;width:260px;display:block;overflow-y:auto;border-bottom:0;border-right:1px solid var(--bd);padding:16px 12px}}
@media(max-width:760px){nav{display:block;overflow:visible}.mb{display:block;width:100%;text-align:left;border-radius:10px;font-weight:600;font-size:14px}.mn{display:none;margin-top:8px;max-height:70vh;overflow-y:auto}nav.open .mn{display:flex}}
.gt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}#gr{display:none}#gr.show{display:flex}
</style></head><body>
<nav id="nav"></nav>
<main><h1 id="t"></h1><div class="bar"><span id="sc"></span><button id="rs" style="background:none;border:0;color:var(--pri);cursor:pointer;font:inherit">Làm lại chủ đề</button></div>
<button class="gt" id="gt" onclick="$('gr').classList.toggle('show');lab()"></button><div class="grid" id="gr"></div><div class="card" id="cd"></div><div class="ctl"><button id="pv">← Câu trước</button><button class="p" id="nx">Câu sau →</button></div></main>
<script>
const T=[
{n:"CĐ1 · Trí tuệ nhân tạo",q:[
["Phương án nào nêu đúng hai phân loại chính của AI?","AI Hẹp (ANI) và AI Siêu thông minh (ASI)|AI Hẹp (ANI) và AI Tổng quát (AGI)|AI Tổng quát (AGI) và AI Tự học (ALI)|AI Tổng quát (AGI) và AI Siêu thông minh (ASI)",1,"Đề cương chia AI thành AI Hẹp (ANI) và AI Tổng quát (AGI)."],
["Phát biểu nào phù hợp khi nói về khả năng của AI Hẹp?","Tự chuyển đổi để giải quyết các nhiệm vụ khác nhau|Suy luận giải quyết vấn đề phức tạp như con người|Hiểu ngôn ngữ tự nhiên và tạo văn bản giống người|Giải quyết nhiệm vụ cụ thể theo những gì đã được học",3,"AI Hẹp chỉ thực hiện một hoặc một số nhiệm vụ giới hạn; hầu hết AI hiện nay thuộc loại này."],
["Phương án nào đúng về khả năng suy luận của AI?","Trích xuất thông tin từ dữ liệu để học|Cảm nhận môi trường qua cảm biến|Vận dụng logic và tri thức để đưa ra quyết định hoặc kết luận|Hiểu và tạo ra văn bản như người",2,"Suy luận = dùng tri thức và logic để ra quyết định hoặc giải quyết vấn đề."],
["Phương án nào đúng về khả năng nhận thức của AI?","Trích xuất thông tin từ dữ liệu để học|Cảm nhận và hiểu môi trường thông qua cảm biến, thiết bị đầu vào|Vận dụng logic để ra quyết định|Tìm cách giải quyết tình huống phức tạp",1,"Nhận thức = cảm nhận và hiểu biết môi trường qua cảm biến và thiết bị đầu vào."],
["Phương án nào đúng về khả năng học của AI?","Trích xuất thông tin từ dữ liệu để học và tích lũy tri thức|Cảm nhận môi trường qua cảm biến|Vận dụng logic để kết luận|Giải quyết tình huống phức tạp",0,"Khả năng Học: trích xuất thông tin từ dữ liệu để học và tích lũy tri thức."],
["Phát biểu nào phù hợp nhất khi nói về trợ lí ảo?","Phần mềm giúp máy tính tự học và giải quyết vấn đề|Công nghệ AI hiểu và thực hiện yêu cầu bằng ngôn ngữ tự nhiên|Công nghệ AI nhận dạng suy nghĩ của con người|Thuật toán cho máy tính tư duy như người",1,"Trợ lí ảo tương tác với người dùng bằng ngôn ngữ tự nhiên để tìm thông tin, gửi tin nhắn, thực hiện nhiệm vụ."],
["Phần mềm nào là trợ lí ảo của Apple?","Google Assistant|Alexa|Bixby|Siri",3,"Siri (Apple), Alexa (Amazon), Bixby (Samsung), Google Assistant (Google)."],
["Phần mềm nào là trợ lí ảo của Samsung?","Google Assistant|Alexa|Bixby|Siri",2,"Bixby là trợ lí ảo của Samsung."],
["Thiết bị nào KHÔNG sử dụng AI để điều khiển tự động?","Xe ô tô không người lái|Ấm điện siêu tốc tự động ngắt|Máy bay không người lái|Robot hút bụi thông minh",1,"Ấm siêu tốc ngắt bằng cơ chế nhiệt đơn giản, không cần AI."],
["Tác động của AI đối với việc làm của con người là:","Thay thế hoàn toàn con người|Tạo việc làm mới và thay thế một số công việc hiện có|Chỉ tác động công việc đơn giản|Không có tác động đáng kể",1,"AI thay thế công việc lặp lại, đơn giản nhưng đồng thời tạo ra việc làm mới."],
["Hệ thống AI của YouTube gợi ý video làm nhiệm vụ gì?","Hiển thị quảng cáo phù hợp|Đề xuất video dựa trên sở thích người dùng|Đề xuất chức năng mới|Đề xuất video có nhiều lượt xem",1,"Hệ thống gợi ý dựa trên sở thích, lịch sử xem của từng người."],
["Tính năng nào KHÔNG phải của trợ lí ảo?","Tương tác bằng ngôn ngữ tự nhiên|Tự động cải thiện hiệu suất máy tính|Trả lời câu hỏi của người dùng|Điều khiển thiết bị điện tử trong nhà",1,"Trợ lí ảo không có nhiệm vụ tự cải thiện hiệu suất máy tính."],
["Phần mềm nào là trợ lí ảo của Amazon?","Google Assistant|Alexa|Bixby|Siri",1,"Alexa là trợ lí ảo của Amazon."],
["AI hỗ trợ chẩn đoán bệnh bằng cách nào?","Nhận diện giọng nói bác sĩ|Nhận diện bệnh lí qua hình ảnh y khoa|Phân tích giọng nói bệnh nhân|Quản lí thể dục bệnh nhân",1,"AI phân tích ảnh X-quang, CT, MRI để phát hiện bất thường."],
["Nhận định nào SAI về ảnh hưởng của AI trong tương lai?","Tăng cường tự động hoá|Có thể thay thế con người ở một số lĩnh vực|Tạo nguy cơ về an ninh mạng và quyền riêng tư|AI sẽ luôn an toàn và có lợi cho con người",3,"AI cũng đặt ra cảnh báo về đạo đức, an ninh mạng, quyền riêng tư, việc làm."],
["Phương thức nào KHÔNG dùng để kết nối máy tính với điện thoại?","Cáp USB|Bluetooth|Wifi|Cáp VGA",3,"VGA dùng truyền hình ảnh tới màn hình, không nối với điện thoại."]]},
{n:"CĐ2 · Mạng máy tính",q:[
["Thiết bị nào biến đổi dữ liệu số thành tín hiệu tương tự để truyền qua mạng và ngược lại?","Laptop|Modem|Switch|Access point",1,"Modem (điều chế – giải điều chế)."],
["Thiết bị nào kết nối các thiết bị tạo thành mạng hình sao?","Laptop|Modem|Switch|Máy chủ",2,"Switch đóng vai trò trung tâm của mạng hình sao."],
["Ngoài kết nối không dây, Access point còn có chức năng:","Mở rộng băng thông Internet|Điều chế|Giải điều chế|Định tuyến trong mạng không dây",3,"Access point có thể định tuyến trong mạng không dây và quản lí truy cập người dùng."],
["Ngoài kết nối hình sao, Switch còn có chức năng:","Mở rộng băng thông của đường truyền|Biến đổi dữ liệu số thành tín hiệu tương tự|Biến đổi tương tự thành số|Truyền tín hiệu tương tự giữa các máy",0,"Switch có khả năng mở rộng băng thông (số bit truyền trên giây)."],
["Phòng thực hành có 30 máy tính, muốn nối thành mạng LAN nên dùng:","Modem|Access point|Switch|Router",2,"Switch kết nối nhiều máy trong cùng mạng LAN bằng cáp."],
["Điều gì đảm bảo máy tính và thiết bị mạng giao tiếp đúng cách?","Giao thức mạng|Giao tiếp mạng|Giao dịch mạng|Giao thông mạng",0,"Giao thức mạng là tập quy tắc về định dạng, truyền, nhận dữ liệu."],
["Nhiệm vụ nào KHÔNG phải của giao thức TCP?","Thiết lập, duy trì, đóng kết nối|Định địa chỉ và định tuyến gói dữ liệu|Truyền tải đáng tin cậy, đúng thứ tự|Chia gói, kiểm tra toàn vẹn, truyền lại nếu cần",1,"Định địa chỉ và định tuyến là nhiệm vụ của giao thức IP."],
["Đặc tính nào là nhược điểm của TCP/IP?","Không hỗ trợ đa phương tiện|Kiểm soát luồng kém|Không có khả năng mở rộng|Không có độ tin cậy",0,"TCP/IP không hiệu quả cho thời gian thực và không hỗ trợ đa phương tiện."],
["Chức năng nào của hệ điều hành hỗ trợ người dùng trao đổi dữ liệu?","Kiểm soát thực thi ứng dụng|Quản lí bộ nhớ|Kiểm soát hiệu suất|Chức năng mạng",3,"Chức năng mạng giúp trao đổi dữ liệu, chia sẻ ổ đĩa, thư mục, máy in."],
["Lựa chọn nào bật tính năng chia sẻ thư mục và tệp tin?","Turn on network discovery|Turn off network discovery|Turn on file and printer sharing|Turn off file and printer sharing",2,"“Turn on file and printer sharing” bật chia sẻ tệp và máy in."],
["Chia sẻ ổ đĩa cho người khác chỉ để đọc, xem dữ liệu thì chọn quyền:","Full control|Change|Read|Cả ba quyền",2,"Read chỉ cho phép xem/đọc; Change cho sửa, ghi; Full control toàn quyền."],
["Modem là thiết bị có khả năng nào?","Định tuyến dữ liệu từ gửi tới nhận|Chuyển đổi tín hiệu tương tự sang dữ liệu số và ngược lại|Quản lí truy cập người dùng|Chuyển tiếp dữ liệu giữa các mạng LAN",1,"Modem điều chế và giải điều chế tín hiệu."],
["Bộ định tuyến là thiết bị nào?","Router|WAP|Modem|Switch",0,"Router chuyển tiếp dữ liệu giữa các mạng, nối mạng nội bộ với Internet."],
["Nội dung nào KHÔNG phải giao thức hoạt động trên thiết bị gửi?","Đóng gói dữ liệu|Xác định địa chỉ IP|Giải nén dữ liệu|Truyền gói dữ liệu",2,"Giải nén là việc của thiết bị nhận."],
["Nội dung nào hoạt động trên cả thiết bị gửi và nhận?","Đóng gói dữ liệu|Giải nén dữ liệu|Tiếp nhận gói dữ liệu|Kiểm tra lỗi và đảm bảo độ tin cậy",3,"Cả hai bên đều kiểm tra lỗi và đảm bảo độ tin cậy."],
["Tại thiết bị gửi, sau khi đóng gói, xác định IP và MAC thì thực hiện:","Truyền gói ngay|Xác định đường đi tối ưu|Tiếp nhận gói từ thiết bị khác|Kiểm tra lỗi sau khi truyền",1,"Thứ tự: đóng gói → IP → MAC → đường đi tối ưu → truyền gói."],
["Tại thiết bị gửi, bước ngay trước khi truyền gói dữ liệu đi là:","Đóng gói dữ liệu|Xác định IP, MAC|Xác định đường đi tối ưu|Kiểm tra lỗi",2,"Đường đi tối ưu được xác định rồi mới truyền."],
["Đặc tính nào là ưu điểm của TCP/IP?","Đối phó với độ trễ|Khả năng kiểm soát luồng|Hỗ trợ đa phương tiện|Hiệu suất thời gian thực",1,"Kiểm soát luồng giảm nguy cơ quá tải mạng."],
["Thẻ chức năng nào trong cửa sổ Properties cho phép thiết lập chia sẻ?","General|Tools|Hardware|Sharing",3,"Thẻ Sharing."],
["Lựa chọn nào tắt chia sẻ bằng mật khẩu?","Turn on password protected sharing|Turn off password protected sharing|Turn on network discovery|Turn off network discovery",1,"Turn off password protected sharing."]]},
{n:"CĐ3 · Đạo đức, pháp luật",q:[
["Phương án nào KHÔNG phải nền tảng giao tiếp trong không gian mạng?","Messenger|Zoom|Google Meet|Gửi thư qua bưu điện",3,"Thư bưu điện không dùng phương tiện kĩ thuật số."],
["Đặc điểm “thiếu bảo mật” khi giao tiếp trên mạng đề cập đến:","Phải chia sẻ sở thích, quan điểm nên không còn bảo mật|Chỉ an toàn nếu không mạo danh|Nguy cơ bị đánh cắp thông tin, xâm nhập dữ liệu, lộ thông tin cá nhân|Bảo mật thông tin thì tuyệt đối an toàn",2,"Thiếu bảo mật: đánh cắp thông tin, xâm nhập máy tính, lộ thông tin riêng tư."],
["Bạn B giả làm người bản xứ để có nhiều người theo dõi. Đây là nhược điểm:","Mở rộng khả năng tương tác|Thiếu bảo mật|Thiếu tin cậy|Thiếu liên tục",2,"Thiếu trung thực nên thiếu tin cậy."],
["Họp gấp cho số đông qua Zoom thể hiện ưu điểm:","Cải thiện kĩ năng giao tiếp|Phương tiện đa dạng|Giảm rào cản ban đầu|Không phụ thuộc không gian và thời gian",3,"Không cần di chuyển, họp mọi lúc mọi nơi."],
["Vừa nhận nhiều tin nhắn vừa bị đường truyền kém khi học online là nhược điểm:","Thiếu bảo mật, thiếu liên tục|Thiếu tập trung, thiếu liên tục|Thiếu tập trung, thiếu bảo mật|Thiếu tin cậy, thiếu bảo mật",1,"Nhiều tin nhắn → thiếu tập trung; đường truyền kém → thiếu liên tục."],
["Hành vi nào KHÔNG nên khi ứng xử trên mạng?","Tôn trọng pháp luật, tôn trọng người đối diện|Dùng ngôn từ lai căng, thô tục theo xu hướng giới trẻ|Lan tỏa hình ảnh đẹp về hoạt động tình nguyện|Chỉ đăng thông tin rõ nguồn gốc, đã kiểm chứng",1,"Không sử dụng từ ngữ lai căng, tục tĩu hay bạo lực."],
["Mô tả đúng về giao tiếp trong không gian mạng:","Dùng công cụ công nghệ số|Giao tiếp trực tiếp trong không gian có thiết bị số|Dùng phương tiện kĩ thuật số để liên lạc thông qua nền tảng số|Giao tiếp trực tiếp giữa người với người trên mạng",2,"Theo đề cương: dùng phương tiện kĩ thuật số, qua nền tảng số (email, mạng xã hội, chat)."],
["Dịch vụ nào KHÔNG phải giao tiếp trong không gian mạng?","Thư điện tử|Facebook|Dịch vụ bác sĩ gia đình tại nhà|Nhắn tin Zalo",2,"Bác sĩ gia đình chăm sóc trực tiếp tại nhà."],
["Ưu điểm đúng của giao tiếp trong không gian mạng:","Hỗ trợ người khuyết tật dễ giao tiếp|Dễ kiểm soát nguồn thông tin|Không bị ảnh hưởng sự cố đường truyền|Độ tin cậy cao",0,"Các phương án còn lại là nhược điểm hoặc sai."],
["Nhược điểm đúng của giao tiếp trong không gian mạng:","Không bị giới hạn thời gian, địa điểm|Khó xác định đối tượng giao tiếp chính xác|Tiết kiệm chi phí, thời gian|Mở rộng khả năng tương tác",1,"Thiếu tin cậy: khó xác minh danh tính."],
["Nguyên tắc ứng xử trên không gian mạng:","Lịch sự, luôn làm theo yêu cầu người khác|Lịch sự, tôn trọng người khác và tuân thủ pháp luật|Tích cực chia sẻ mọi thông tin|Chia sẻ rộng rãi mọi thông tin cá nhân",1,"Tôn trọng người khác và tuân thủ pháp luật."],
["Văn bản theo QĐ 874/QĐ-BTTTT (6/2021) liên quan trao đổi thông tin trên mạng:","Bộ luật về An ninh mạng|Bộ quy tắc ứng xử trên mạng xã hội|Bộ quy tắc giao tiếp trên không gian mạng|Bộ quy tắc bảo đảm an ninh mạng",1,"Bộ quy tắc ứng xử trên mạng xã hội."]]},

function drawTF(){const t=TF[ti],b=B[ti],n=t.length;$("t").textContent=T[ti].n+" · Đúng/Sai";
if(!n){$("sc").textContent="";$("gr").innerHTML="";$("cd").innerHTML="Chủ đề này chưa có câu đúng/sai.";$("pv").disabled=$("nx").disabled=true;return}
const fin=i=>b[i]&&[0,1,2,3].every(j=>b[i][j]),pts=i=>b[i]?[0,1,2,3].filter(j=>b[i][j]==t[i][2][j]).length:0;
$("sc").textContent=`Đã xong ${t.filter((_,i)=>fin(i)).length}/${n} câu · Đúng ${t.reduce((s,_,i)=>s+pts(i),0)} ý`;
$("gr").innerHTML=t.map((_,i)=>`<button class="${i==qi?'cur ':''}${fin(i)?(pts(i)==4?'ok':'no'):''}" onclick="qi=${i};draw()">${i+1}</button>`).join("");
const q=t[qi],e=s=>s.replace(/</g,"&lt;");
$("cd").innerHTML=`<p class="q">Câu ${qi+1}. ${e(q[0])}</p>`+q[1].map((s,j)=>{const v=b[qi]&&b[qi][j];return `<div class="st"><b>${"abcd"[j]}) ${e(s)}</b>`+["Đ","S"].map(c=>`<button class="tf ${v?(c==q[2][j]?'ok':c==v?'no':''):''}" ${v?'disabled':''} onclick="tf(${j},'${c}')">${c=="Đ"?"Đúng":"Sai"}</button>`).join("")+`</div>`}).join("")+(fin(qi)?`<div class="ex"><b>Được ${pts(qi)}/4 ý.</b> Đáp án: ${[...q[2]].map((c,j)=>"abcd"[j]+"–"+(c=="Đ"?"Đúng":"Sai")).join(", ")}.</div>`:"");
$("pv").disabled=qi==0;$("nx").disabled=qi==n-1}
